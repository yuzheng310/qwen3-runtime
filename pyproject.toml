[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen3-runtime"
version = "0.0.1"
description = "Compact Qwen3-4B single-GPU inference runtime"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4.0",
    "numpy>=1.26",
    "safetensors>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
correctness = ["transformers>=4.51", "huggingface_hub>=0.24"]

[tool.setuptools.packages.find]
where = ["."]
include = ["qwen3_runtime*", "bench*", "workloads*"]

[tool.setuptools.package-data]
"workloads.code_localization" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
